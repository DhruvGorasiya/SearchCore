name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Cache C++ build artifacts
        uses: actions/cache@v4
        with:
          path: |
            lib/libsearchindex.a
            internal/index/cpp/build/
          key: cpp-lib-${{ hashFiles('internal/index/cpp/**') }}

      - name: Build C++ static library
        run: make cpp-lib

      - name: Build
        run: go build ./...

      - name: Test (with race detector)
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...
